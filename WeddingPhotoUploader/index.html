<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Drive Uploader (Apps Script)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .card { border: 1px solid rgba(0,0,0,.1); border-radius: 14px; padding: 18px; box-shadow: 0 2px 16px rgba(0,0,0,.06); }
    .btns { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    button, a.btn { border:1px solid #1f6feb; background:#2f81f7; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; }
    a.btn.secondary, button.secondary { background:transparent; color:#2f81f7; }
    .hint { color:#6b7280; font-size:.92rem; margin-top:6px; }
    .list { margin-top:18px; display:grid; gap:12px; }
    .item { border:1px solid rgba(0,0,0,.1); border-radius:12px; padding:12px; background: rgba(0,0,0,.02); }
    .row { display:flex; align-items:center; gap:8px; }
    .spacer { flex:1; }
    .name { font-weight:600; word-break:break-all; }
    .meta { color:#6b7280; font-size:.85rem; }
    .bar { width:100%; height:10px; border-radius:999px; background: rgba(0,0,0,.08); overflow:hidden; margin-top:8px; }
    .bar > div { height:100%; width:0%; background: linear-gradient(90deg, #2f81f7, #13c6ff); transition: width .2s ease; }
    .status { font-size:.9rem; margin-top:6px; }
    .ok { color:#16a34a; } .err { color:#dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Upload Photos & Videos to Drive</h1>
    <div class="card">
      <div class="btns">
        <button id="uploadBtn">Upload photos/videos</button>
        <a class="btn secondary" id="openFolderBtn" target="_blank" rel="noopener">Open shared folder</a>
      </div>
      <div class="hint">
        Uploads stay on this page. No Google sign‑in required. Large files (&gt;~50 MB) are not supported by Apps Script—use smaller clips/photos. <!-- practical limit -->
      </div>

      <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
      <div class="list" id="list"></div>
    </div>
  </div>

  <script>
    // ========= CONFIG =========
    const WEB_APP_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL';
    const FOLDER_ID   = 'YOUR_DRIVE_FOLDER_ID'; // for the "Open folder" button

    // ======== UI wiring ========
    const uploadBtn = document.getElementById('uploadBtn');
    const openFolderBtn = document.getElementById('openFolderBtn');
    const fileInput = document.getElementById('fileInput');
    const listEl = document.getElementById('list');

    openFolderBtn.href = 'https://drive.google.com/drive/folders/' + encodeURIComponent(FOLDER_ID);
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files || [])));

    // ======== Helpers ========
    function pretty(bytes) {
      const u = ['B','KB','MB','GB']; let i = 0, n = bytes;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
    }

    function makeItem(file) {
      const item = document.createElement('div'); item.className = 'item';
      const row1 = document.createElement('div'); row1.className = 'row';
      const name = document.createElement('div'); name.className='name'; name.textContent = file.name;
      const spacer = document.createElement('div'); spacer.className='spacer';
      const size = document.createElement('div'); size.className='meta'; size.textContent = pretty(file.size);
      row1.append(name, spacer, size);
      const bar = document.createElement('div'); bar.className='bar';
      const fill = document.createElement('div'); bar.appendChild(fill);
      const status = document.createElement('div'); status.className='status'; status.textContent = 'Waiting…';
      item.append(row1, bar, status); listEl.prepend(item);
      return { item, fill, status };
    }

    // ======== Upload flow ========
    async function handleFiles(files) {
      if (!files.length) return;
      uploadBtn.disabled = true;
      for (const file of files) {
        const ui = makeItem(file);
        try {
          // Client-side guard for Apps Script practical limit
          if (file.size > 48 * 1024 * 1024) {
            ui.status.innerHTML = `<span class="err">Too large (>${pretty(48*1024*1024)})</span>`;
            continue;
          }
          const { name, type } = file;
          ui.status.textContent = 'Encoding…';
          const base64 = await fileToBase64(file); // data:...;base64,XXXX
          const b64 = base64.split(',')[1] || base64; // strip data URL prefix

          const body = JSON.stringify({ name, type, data: b64 });

          await xhrUpload(WEB_APP_URL, body, ui);
        } catch (err) {
          console.error(err);
          ui.status.innerHTML = `<span class="err">${String(err.message || err)}</span>`;
        }
      }
      uploadBtn.disabled = false;
      fileInput.value = '';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('Read failed'));
        fr.onload = () => resolve(fr.result);
        fr.readAsDataURL(file);
      });
    }

    // Use XHR to get upload progress; keep request "simple" (text/plain) to avoid CORS preflight.
    function xhrUpload(url, jsonBody, ui) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); // simple request (no preflight)
        xhr.withCredentials = false; // anonymous

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            ui.fill.style.width = pct + '%';
            ui.status.textContent = `Uploading… ${pct}%`;
          } else {
            ui.status.textContent = 'Uploading…';
          }
        };

        xhr.onreadystatechange = () => {
          if (xhr.readyState === 4) {
            try {
              // Apps Script web apps respond via redirect; XHR follows it and gives final body
              // Parse JSON { ok, id, name, url }
              const res = JSON.parse(xhr.responseText || '{}');
              if (xhr.status >= 200 && xhr.status < 300 && res.ok) {
                ui.fill.style.width = '100%';
                ui.status.innerHTML = `<span class="ok">Uploaded ✓</span> — ${res.url}Open file</a>`;
                resolve();
              } else {
                throw new Error(res.error || `HTTP ${xhr.status}`);
              }
            } catch (e) {
              ui.status.innerHTML = `<span class="err">Failed (${xhr.status})</span>`;
              reject(e);
            }
          }
        };

        xhr.onerror = () => {
          ui.status.innerHTML = `<span class="err">Network error</span>`;
          reject(new Error('Network error'));
        };

        xhr.send(jsonBody);
      });
    }
  </script>
</body>
</html>
