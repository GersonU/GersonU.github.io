<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding Photo Uploader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <style>
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .btns { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    button, a.btn { border:1px solid #1f6feb; background:#2f81f7; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; }
    a.btn.secondary, button.secondary { background:transparent; color:#2f81f7; }
    .list { margin-top:18px; display:grid; gap:12px; }
    .item { border:1px solid rgba(0,0,0,.1); border-radius:12px; padding:12px; background: rgba(0,0,0,.02); }
    .row { display:flex; align-items:center; gap:8px; }
    .spacer { flex:1; }
    .name { font-weight:600; word-break:break-all; }
    .meta { color:#6b7280; font-size:.85rem; }
    .bar { width:100%; height:10px; border-radius:999px; background: rgba(0,0,0,.08); overflow:hidden; margin-top:8px; }
    .bar > div { height:100%; width:0%; background: linear-gradient(90deg, #2f81f7, #13c6ff); transition: width .2s ease; }
    .status { font-size:.9rem; margin-top:6px; }
    .ok { color:#16a34a; } .err { color:#dc2626; }

    .ui-menu{
        font-family: Pinyon Script;
      }
      input[placeholder], [placeholder], *[placeholder] {
        font-family: Pinyon Script;
      }
      *::placeholder {
        font-family: Pinyon Script;
      }
      .searchLabel{
        font-family: Pinyon Script;
      }
      .CustomBorder{
        max-width: 90%;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        margin-top: 52px;
        margin-bottom: 100px;
        padding: 60px;
        background-image: radial-gradient( circle at 0 0, #f5efe8 60px, #000000 60px, #000000 62px, transparent 60px ),radial-gradient( circle at 100% 0, #f5efe8 60px, #000000 60px, #000000 62px, transparent 60px ),radial-gradient( circle at 0 100%, #f5efe8 60px, #000000 60px, #000000 62px, transparent 60px ),radial-gradient( circle at 100% 100%, #f5efe8 60px, #000000 60px, #000000 62px, transparent 60px );
      }
      .CustomBorder::before{
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: calc(100% - 120px);
        -webkit-transform: translate(-50%, -50%);
        -moz-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        border-left: 2px solid #000000;
        border-right: 2px solid #000000;
        z-index: -1;
      }
      .CustomBorder::after{
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: calc(100% - 120px);
        height: 100%;
        -webkit-transform: translate(-50%, -50%);
        -moz-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        border-top: 2px solid #000000;
        border-bottom: 2px solid #000000;
        z-index: -1;
      }
  </style>
</head>
<body>
  <div style="background-color:#f5efe8;">
    <div class="container CustomBorder">

        <div class="row justify-content-center align-items-center py-5">
            <div class="col-10 col-lg-4 text-center">
              <img src="../images/Curlicue.png" style="max-width:100%;transform: scaleY(-1);">
            </div>
          </div>
          <div class="row justify-content-center align-items-center pt-5 pb-2">
            <div class="col-10 col-lg-4 text-center">
                <h1>Upload Photos & Videos to Drive</h1>
                <button id="uploadBtn">Upload photos/videos</button>
                <a class="btn secondary" id="openFolderBtn" target="_blank" rel="noopener">Open shared folder</a>
            </div>
          </div>
          <div class="row justify-content-center align-items-center py-1">
            <div class="col-10 col-lg-4 text-center">
                <label class="form-label">Uploads stay on this page. No Google sign‑in required. Large files (&gt;~50 MB) are not supported by Apps Script—use smaller clips/photos.</button>
            </div>
          </div>
          <div class="row justify-content-center align-items-center pt-1 pb-5">
            <div class="col-12">
                <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
                <div class="list" id="list"></div>
            </div>
          </div>
          <div class="row justify-content-center align-items-center py-5">
            <div class="col-10 col-lg-4 text-center">
              <img src="../images/Curlicue.png" style="max-width:100%;">
            </div>
          </div>
    </div>
  </div>

  <script>
    // ========= CONFIG =========
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyXseFGF4mPTr2Yt10faHoSVxAqk8bCv8sk9Lyy7G79vcUQ-rQ_xnJw5SOus72LBlRT/exec';
    const FOLDER_ID   = '1BHmcNLzyUNgYO0qfIQqAYJCrVzDBSoY7'; // for the "Open folder" button

    // ======== UI wiring ========
    const uploadBtn = document.getElementById('uploadBtn');
    const openFolderBtn = document.getElementById('openFolderBtn');
    const fileInput = document.getElementById('fileInput');
    const listEl = document.getElementById('list');

    openFolderBtn.href = 'https://drive.google.com/drive/folders/' + encodeURIComponent(FOLDER_ID);
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files || [])));

    // ======== Helpers ========
    function pretty(bytes) {
      const u = ['B','KB','MB','GB']; let i = 0, n = bytes;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
    }

    function makeItem(file) {
      const item = document.createElement('div'); item.className = 'item';
      const row1 = document.createElement('div'); row1.className = 'row';
      const name = document.createElement('div'); name.className='name'; name.textContent = file.name;
      const spacer = document.createElement('div'); spacer.className='spacer';
      const size = document.createElement('div'); size.className='meta'; size.textContent = pretty(file.size);
      row1.append(name, spacer, size);
      const bar = document.createElement('div'); bar.className='bar';
      const fill = document.createElement('div'); bar.appendChild(fill);
      const status = document.createElement('div'); status.className='status'; status.textContent = 'Waiting…';
      item.append(row1, bar, status); listEl.prepend(item);
      return { item, fill, status };
    }

    // ======== Upload flow ========
    async function handleFiles(files) {
      if (!files.length) return;
      uploadBtn.disabled = true;
      for (const file of files) {
        const ui = makeItem(file);
        try {
          // Client-side guard for Apps Script practical limit
          if (file.size > 500 * 1024 * 1024) {
            ui.status.innerHTML = `<span class="err">Too large (>${pretty(48*1024*1024)})</span>`;
            continue;
          }
          const { name, type } = file;
          ui.status.textContent = 'Encoding…';
          const base64 = await fileToBase64(file); // data:...;base64,XXXX
          const b64 = base64.split(',')[1] || base64; // strip data URL prefix
          
          const searchParams = new URLSearchParams(window.location.search);

          const jsonbody =  JSON.stringify({ name: file.name, type: file.type || 'application/octet-stream', data: b64, password: searchParams.get('password') });

          xhrUpload(WEB_APP_URL, jsonbody, ui);
        } catch (err) {
          console.error(err);
          ui.status.innerHTML = `<span class="err">${String(err.message || err)}</span>`;
        }
      }
      uploadBtn.disabled = false;
      fileInput.value = '';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('Read failed'));
        fr.onload = () => resolve(fr.result);
        fr.readAsDataURL(file);
      });
    }

    // Use XHR to get upload progress; keep request "simple" (text/plain) to avoid CORS preflight.
    function xhrUpload(url, jsonBody, ui) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); // simple

        // xhr.upload.onprogress = (e) => {
        //   if (e.lengthComputable) {
        //     const pct = Math.round((e.loaded / e.total) * 100);
        //     ui.fill.style.width = pct + '%';
        //     ui.status.textContent = `Uploading… ${pct}%`;
        //   } else {
        //     ui.status.textContent = 'Uploading…';
        //   }
        // };

        xhr.onreadystatechange = () => {
          if (xhr.readyState === 4) {
            try {
              // Apps Script web apps respond via redirect; XHR follows it and gives final body
              // Parse JSON { ok, id, name, url }
              const res = JSON.parse(xhr.responseText || '{}');
              if (xhr.status >= 200 && xhr.status < 300 && res.ok) {
                ui.fill.style.width = '100%';
                ui.status.innerHTML = `<span class="ok">Uploaded ✓</span>`;
                resolve();
              } else {
                throw new Error(res.error || `HTTP ${xhr.status}`);
              }
            } catch (e) {
              ui.status.innerHTML = `<span class="err">Failed (${xhr.status})</span>`;
              reject(e);
            }
          }
        };

        xhr.onerror = () => {
          ui.status.innerHTML = `<span class="err">Network error</span>`;
          reject(new Error('Network error'));
        };

        xhr.send(jsonBody);
      });
    }
  </script>
</body>
</html>
